    <div class="loading" id="loader">
      <svg class="circular-loader" viewBox="25 25 50 50">
        <circle class="loader-path" cx="50" cy="50" r="20"></circle>
      </svg>
    </div>

    <!-- <img id="bgImage" src="%PUBLIC_URL%/images/bg.png" alt="Background" style="width: 100%; height: 100%" /> -->
  </div>

  <script>
    console.log("index.html start loading");
    const token = localStorage.getItem("accesstoken");
    const loader = document.getElementById("loader");
    // const bgImage = document.getElementById("bgImage");

    window.addEventListener("load", () => {
      if (token) {
        // bgImage.style.clipPath = "inset(0 0 0 0)"; // Show the full image
        // bgImage.style.display = "none";
        if (loader) {
          loader.style.display = "none";
        }
      } else if (!token) {
        // bgImage.style.display = "block";
        if (loader) {
          loader.style.display = "block";
        }
      }
      // const page_load_time = performance.getEntriesByType("navigation")[0];
      // console.log(page_load_time);
    });

    if (token) {
      /* if (bgImage) {
        bgImage.style.display = "none";
      } */
      if (loader) {
        loader.style.display = "block";
      }

      document.body.style.background = "none";
    } else if (!token) {
      /* if (bgImage) {
        bgImage.style.display = "block";
      } */
      if (loader) {
        loader.style.display = "none";
      }
    }

    if (!token) {
      // document.body.style.background = "url('./images/loginbg.jpg') no-repeat center center";
      document.body.style.backgroundSize = "cover";
    }
  </script>
